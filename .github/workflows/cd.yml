name: cd

# Triggered by version tags (vX.Y.Z). Manual dispatch also works for ad-hoc
# dry runs. The tag's `v` prefix and the workflow filename `cd.yml` are
# pinned on the npm trusted-publisher side — do not rename either.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify but don't publish to npm"
        required: false
        default: "false"

permissions:
  contents: write  # create GitHub Releases
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      # Node 24 ships with npm 11.x, required for OIDC trusted publishing.
      # CRITICAL: do NOT set `registry-url` on setup-node for OIDC-only
      # workflows. When set, setup-node writes an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN} and exports a placeholder
      # NODE_AUTH_TOKEN, which npm CLI prefers over the OIDC token and
      # surfaces as a misleading 404 on publish. See npm/cli#8730 and
      # actions/setup-node#1477. setup-node here is purely to provide a
      # recent Node runtime so `npm publish` has npm ≥ 9.5.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist artifact
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/opencode-mem0.d.ts || (echo "dist/opencode-mem0.d.ts missing" && exit 1)

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish to npm (skip if dry-run)
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag push: $GITHUB_REF_NAME is "vX.Y.Z" → strip the "v" for the title.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Creating GitHub release for $GITHUB_REF_NAME (title: $VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag

      - name: Attach dist artifact to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add the prebuilt bundle as a downloadable asset on the release.
          gh release upload "$GITHUB_REF_NAME" dist/index.js \
            --clobber \
            --label "bundled plugin (dist/index.js)"
