name: cd

# Triggered by version tags (vX.Y.Z). Manual dispatch also works for ad-hoc
# dry runs. The tag's `v` prefix and the workflow filename `cd.yml` are
# pinned on the npm trusted-publisher side — do not rename either.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify but don't publish to npm"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      # setup-node is required for npm OIDC trusted publishing — it sets up
      # the registry URL and configures NODE_AUTH_TOKEN from the OIDC token
      # (`id-token: write` permission above). Without this, `npm publish`
      # fails with ENEEDAUTH even when the OIDC config on npmjs.com is
      # correct.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist artifact
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/opencode-mem0.d.ts || (echo "dist/opencode-mem0.d.ts missing" && exit 1)

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish to npm (skip if dry-run)
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        run: npm publish --provenance --access public
