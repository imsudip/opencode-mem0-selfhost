name: cd

# Triggered by version tags (vX.Y.Z). Manual dispatch also works for ad-hoc
# dry runs. The tag's `v` prefix and the workflow filename `cd.yml` are
# pinned on the npm trusted-publisher side — do not rename either.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify but don't publish to npm"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist artifact
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/opencode-mem0.d.ts || (echo "dist/opencode-mem0.d.ts missing" && exit 1)

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish to npm (skip if dry-run)
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # unused with OIDC, but harmless fallback
          # OIDC trusted publishing reads no secret; npm CLI uses the
          # ACTIONS_ID_TOKEN_REQUEST_TOKEN env var automatically.
