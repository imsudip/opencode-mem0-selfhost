name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: type-check + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist artifact
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/opencode-mem0.d.ts || (echo "dist/opencode-mem0.d.ts missing" && exit 1)
          echo "Build artifacts present."

      - name: Verify opencode-skills shipped
        run: |
          test -d opencode-skills/mem0-remember || (echo "skills missing" && exit 1)
          test -d opencode-skills/mem0-tour || (echo "skills missing" && exit 1)
          echo "Skills shipped."
